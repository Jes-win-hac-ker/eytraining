<!DOCTYPE html>
<html>
<head>
  <style>
    body{
        background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
    }
    h1 {
      background-color: tomato;
    }

    h2 {
      background-color: orange;
    }

    h3 {
      background-color: dodgerblue;
    }

    h4 {
      background-color: mediumseagreen;
    }

    h5, h6 {
      color: blueviolet;
    }

    h6 {
      border: 5px dashed tomato;
      
    }
  </style>
</head>
<body>
  <h1 style="background-color: tomato;">Heading 1</h1>
  <h2 style="background-color: orange;">Heading 2</h2>
  <h3 style="background-color: dodgerblue;">Heading 3</h3>
  <h4 style="background-color: mediumseagreen;">Heading 4</h4>
  <h5 style="color: blueviolet;">Heading 5</h5>
  <h6 style="border: 5px dashed tomato; color: blueviolet;">Heading 6</h6>
</body>
</html>
